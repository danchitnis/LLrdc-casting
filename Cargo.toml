[package]
name = "llrdc-casting"
version = "0.1.0"
edition = "2021"

[dependencies]
drm = "0.15"
nix = { version = "0.31", features = ["mman", "fs", "ioctl", "net"] }
libc = "0.2"
tokio = { version = "1.44", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wtransport = "0.7"
rcgen = "0.14"
time = "0.3"
x509-parser = "0.17"

[profile.release]
opt-level = 2
codegen-units = 16
strip = "symbols"

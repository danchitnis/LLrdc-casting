[package]
name = "rock5c-v4l2-drm"
version = "0.1.0"
edition = "2021"

[dependencies]
drm = "0.14"
nix = { version = "0.29", features = ["mman", "fs", "ioctl", "net"] }
libc = "0.2"
tokio = { version = "1.38", features = ["full"] }
wtransport = "0.1.12"
rcgen = "0.13"

[profile.release]
opt-level = 2
codegen-units = 16

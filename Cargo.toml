[package]
name = "llrdc-casting"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = "1.25"
drm = "0.15"
nix = { version = "0.31", features = ["mman", "fs", "ioctl", "net"] }
rustix = { version = "1.1", features = ["net", "process"] }
thread-priority = "3.1"
tokio = { version = "1.44", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wtransport = "0.7"
rcgen = "0.14"
time = "0.3"
x509-parser = "0.17"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
signature = "2"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"

[profile.release]
opt-level = 2
codegen-units = 16
strip = "symbols"
